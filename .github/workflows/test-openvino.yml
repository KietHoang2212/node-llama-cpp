name: Test OpenVINO
on: workflow_dispatch
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-1
          - os: windows-latest
            artifact: win-3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      
      - name: Download Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download -n bins-${{ matrix.artifact }} --dir bins
      
      - name: Setup OpenVINO Windows
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://storage.openvinotoolkit.org/repositories/openvino/packages/2026.2.1/windows/openvino_toolkit_windows_2026.2.1.21919.ede283a88e3_x86_64.zip" -OutFile "openvino.zip"
          Expand-Archive -Path openvino.zip -DestinationPath . -Force
          Remove-Item openvino.zip
          $openvinoDir = "$pwd\openvino_toolkit_windows_2026.2.1.21919.ede283a88e3_x86_64\runtime"
          $binDir = "$pwd\bins\win-x64-openvino"
          echo "$openvinoDir\bin\intel64\Release" >> $env:GITHUB_PATH
          echo "$openvinoDir\3rdparty\tbb\bin" >> $env:GITHUB_PATH
          echo "$binDir" >> $env:GITHUB_PATH
      
      - name: Setup OpenVINO Linux
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y intel-opencl-icd ocl-icd-libopencl1 opencl-headers opencl-clhpp-headers ocl-icd-opencl-dev libtbb12 || true
          curl -L https://storage.openvinotoolkit.org/repositories/openvino/packages/2026.2.1/linux/openvino_toolkit_ubuntu22_2026.2.1.21919.ede283a88e3_x86_64.tgz --output openvino.tgz
          tar -xf openvino.tgz
          openvinoDir="$(pwd)/openvino_toolkit_ubuntu22_2026.2.1.21919.ede283a88e3_x86_64/runtime"
          binDir="$(pwd)/bins/linux-x64-openvino"
          echo "LD_LIBRARY_PATH=$openvinoDir/lib/intel64:$openvinoDir/3rdparty/tbb/lib:$binDir:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          
      - name: Download Model
        run: node dist/cli/cli.js pull hf:Qwen/Qwen2.5-0.5B-Instruct-GGUF/qwen2.5-0.5b-instruct-q4_k_m.gguf --dir ./models --name qwen.gguf
        
      - name: Test OpenVINO Inference
        shell: bash
        run: |
          cat << 'EOF' > test-openvino.js
          import { Llama, LlamaChatSession } from "./dist/index.js";
          import { createRequire } from "module";
          import fs from "fs/promises";
          import path from "path";
          
          const require = createRequire(import.meta.url);
          
          async function main() {
              const isWin = process.platform === "win32";
              const binFolder = isWin ? "win-x64-openvino" : "linux-x64-openvino";
              const bindingPath = path.join(process.cwd(), "bins", binFolder, "llama-addon.node");
              const buildMetadataPath = path.join(process.cwd(), "bins", binFolder, "_nlcBuildMetadata.json");
              
              console.log("Loading binding from:", bindingPath);
              const binding = require(bindingPath);
              const buildMetadata = JSON.parse(await fs.readFile(buildMetadataPath, "utf8"));
              
              const llama = await Llama._create({
                  bindings: binding,
                  bindingPath: bindingPath,
                  buildType: "prebuilt",
                  buildMetadata: buildMetadata,
                  logger: Llama.defaultConsoleLogger,
                  vramPadding: 0,
                  ramPadding: 0,
                  debug: true
              });
          
              const modelPath = path.join(process.cwd(), "models", "qwen.gguf");
              const model = await llama.loadModel({ modelPath, gpuLayers: "max", ignoreMemorySafetyChecks: true });
              
              const context = await model.createContext({ contextSize: 1024 });
              const session = new LlamaChatSession({ contextSequence: context.getSequence() });
              
              console.log("Prompting...");
              const res = await session.prompt("You are a helpful test bot. Say SUCCESS.", { maxTokens: 20 });
              console.log("Response:", res);
              if (!res.includes("SUCCESS")) process.exit(1);
          }
          main().catch(e => { console.error(e); process.exit(1); });
          EOF
          node test-openvino.js
